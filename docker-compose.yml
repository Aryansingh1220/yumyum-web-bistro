version: '3.8'

services:
  web:
    image: docker.io/yumyum-restaurant:latest
    container_name: yumyum-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - yumyum-network

networks:
  yumyum-network:
    driver: bridge 